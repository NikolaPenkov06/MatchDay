<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MatchDay</title>
    <link rel="stylesheet" th:href="@{/css/edit-profile.css}">
</head>

<body>

<header class="navbar">
    <a th:href="@{/home}">
        <div class="logo">
            <img th:src="@{/images/logo.png}" alt="MatchDay logo">
            <h1>MatchDay</h1>
        </div>
    </a>
    <nav class="admin-nav">
        <ul>
            <li><a th:href="@{/edit-roles}">Edit Roles</a></li>
            <li><a th:href="@{/add-match}">Add Match</a></li>
            <li><a th:href="@{/add-article}">Add Article</a></li>
        </ul>
    </nav>
    <nav>
        <ul>
            <li><a th:href="@{/articles}">Articles</a></li>
            <li><a th:href="@{/league-tables-menu}">League Tables</a></li>
            <li><a th:href="@{/matches-menu}">Matches</a></li>
        </ul>
    </nav>
</header>

<aside class="profile">
    <img th:src="@{${user.profilePicture}}" alt="Profile Picture" class="profile-pic">
    <h2 th:text="${user.firstName}">Nikola Penkov</h2>
    <h2 th:text="${user.lastName}">Nikola Penkov</h2>
    <p class="username" th:text="'@' + ${user.username}">@username</p>
    <p class="email" th:text="${user.email}">moqtosmiprofil2006@gmail.com</p>
    <p class="country" th:text="${user.country}">BULGARIA</p>
    <div class="profile-buttons">
        <a th:href="@{/}" class="logout">Log out</a>

        <form th:action="@{/email-preference/{id}(id=${user.id})}"
              method="post"
              style="display:inline;">
            <button type="submit"
                    class="logout"
                    th:text="${user.emailsEnabled} ? 'Disable Emails' : 'Enable Emails'">
            </button>
        </form>
    </div>
</aside>


<aside class="fav-team">
    <a th:href="@{/team/{id}(id=${user.favouriteTeam.id})}">
        <img th:src="@{${user.favouriteTeam.logo}}" class="team-logo" alt="idk">
    </a>

    <h2 class="team-name">
        <a th:href="@{/team/{id}(id=${user.favouriteTeam.id})}"
           th:text="${user.favouriteTeam.name}">Inter</a>
    </h2>
    <p  class="league-position" th:text="${position} + ' in ' + ${user.favouriteTeam.league.name}">5th in Serie A</p>
    <p  class="league-position" th:text="${user.favouriteTeam.points} + ' pts'">9 pts</p>
    <p class="latest-match">Latest match</p>
    <p  class="latest-match-text" th:text="${latestMatch}">3-0 vs Bologna</p>
    <p class="manager">Manager</p>
    <p  class="manager-text" th:text="${user.favouriteTeam.coachName}">Christian Chivu</p>
</aside>

<main class="content">

    <section class="edit-profile-box">

        <h2>Edit profile</h2>

        <form th:action="@{/edit-profile}"
              method="post"
              th:object="${editProfileRequest}">


            <!-- FIRST ROW -->
            <div class="name-row">

                <div class="field-group">
                    <label>First Name</label>

                    <input type="text"
                           th:field="*{firstName}">

                    <p class="error"
                       th:if="${#fields.hasErrors('firstName')}"
                       th:errors="*{firstName}">
                    </p>
                </div>


                <div class="field-group">
                    <label>Last Name</label>

                    <input type="text"
                           th:field="*{lastName}">

                    <p class="error"
                       th:if="${#fields.hasErrors('lastName')}"
                       th:errors="*{lastName}">
                    </p>
                </div>

            </div>


            <!-- USERNAME -->
            <div class="field-group">
                <label>Username</label>

                <input type="text"
                       th:field="*{username}">

                <p class="error"
                   th:if="${#fields.hasErrors('username')}"
                   th:errors="*{username}">
                </p>
            </div>


            <!-- PROFILE PICTURE -->
            <div class="field-group">
                <label>Profile picture</label>

                <input type="text"
                       th:field="*{profilePicture}">

                <p class="error"
                   th:if="${#fields.hasErrors('profilePicture')}"
                   th:errors="*{profilePicture}">
                </p>
            </div>


            <!-- EMAIL -->
            <div class="field-group">
                <label>Email</label>

                <input type="text"
                       th:field="*{email}">

                <p class="error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>
            </div>


            <!-- COUNTRY -->
            <div class="field-group">
                <label>Country</label>

                <select class="select-field"
                        th:field="*{country}">

                    <option th:each="country : ${T(bg.softuni.matchday.user.model.Country).values()}"
                            th:value="${country}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(country))}">
                    </option>

                </select>

                <p class="error"
                   th:if="${#fields.hasErrors('country')}"
                   th:errors="*{country}">
                </p>
            </div>


            <!-- FAVOURITE TEAM -->
            <div class="field-group">
                <label>Favourite team</label>

                <select class="select-field"
                        th:field="*{favouriteTeamName}">

                    <option th:each="team : ${teamNames}"
                            th:value="${team}"
                            th:text="${team}">
                    </option>

                </select>

                <p class="error"
                   th:if="${#fields.hasErrors('favouriteTeamName')}"
                   th:errors="*{favouriteTeamName}">
                </p>
            </div>


            <!-- ACTIONS -->
            <div class="edit-profile-actions">

                <button type="submit">
                    Save
                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
